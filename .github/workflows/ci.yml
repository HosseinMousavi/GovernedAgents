name: ci
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: ssa, POSTGRES_PASSWORD: ssa, POSTGRES_DB: ssa }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ssa" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ssa:ssa@localhost:5432/ssa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests (access rules, tools, agents, evals)
        run: pytest tests/unit --cov=store_support --cov-report=term-missing
      - name: Integration (MCP over HTTP + Postgres repository)
        run: pytest tests/integration
      - name: Offline evals -> scorecard (fails if governance metrics < 1.0)
        run: python -m store_support.evals.runner
      - uses: actions/upload-artifact@v4
        with: { name: eval-scorecard, path: eval_results/latest.json }

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push on PRs)
        uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: store-support-agent:${{ github.sha }} }
