name: weekly-eval-drift
on:
  schedule: [{ cron: "0 13 * * 1" }]   # Mondays 13:00 UTC
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Restore baseline
        uses: actions/cache@v4
        with: { path: eval_results/baseline.json, key: eval-baseline-${{ hashFiles('src/store_support/evals/datasets/*.jsonl') }} }
      - name: Run evals (online if ANTHROPIC_API_KEY is set, else offline)
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] && [ -n "${{ secrets.DATABASE_URL }}" ]; then
            DATABASE_URL='${{ secrets.DATABASE_URL }}' python -m store_support.evals.runner --online
          else
            python -m store_support.evals.runner
          fi
      - name: Drift check (fails if any metric drops > 0.05 vs baseline)
        run: python -m store_support.evals.drift
      - name: DeepEval judged tier (Claude as judge) - only when a key is configured
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: pip install -e ".[deepeval]" && deepeval test run tests/evals -q
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: weekly-eval, path: eval_results/ }
