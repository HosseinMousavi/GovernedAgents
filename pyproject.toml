[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "store-support-agent"
version = "0.1.0"
description = "Governed multi-agent customer-issue resolver: scoped MCP tools, RAG with grading, kill switch, evals, OpenTelemetry."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.1",
  "pgvector>=0.3",
  "mcp>=1.2",
  "anthropic>=0.40",
  "openai>=1.40",
  "langgraph>=0.2.30",
  "langchain-core>=0.3",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "structlog>=24.1",
  "faker>=26.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "testcontainers[postgres]>=4.7"]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
sdk = ["claude-agent-sdk>=0.1"]

[project.scripts]
ssa-mcp = "store_support.mcp_server.server:main"
ssa-seed = "store_support.data.seed:main"
ssa-ingest = "store_support.knowledge.ingest:main"
ssa-eval = "store_support.evals.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: requires Postgres", "llm: requires an LLM endpoint"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["store_support"]
